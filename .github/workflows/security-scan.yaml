---
name: Security Scan
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - edited
      - synchronize
permissions:
  contents: read

jobs:
  checkov:
    name: CloudFormation security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install Checkov
        run: pip install checkov==3.4.11
      - name: Scan CloudFormation templates
        run: make test-cfn
