AWSTemplateFormatVersion: '2010-09-09'
Description: ACFS3 - CloudFront with Header Security and site content
Transform: 'AWS::Serverless-2016-10-31'

Parameters:
  CertificateArn:
    Description: Certificate locater
    Type: String
  DomainName:
    Description: Apex domain
    Type: String
  SubDomain:
    Description: Subdomain
    Type: String
  S3BucketLogs:
    Description: Logging Bucket
    Type: String
  S3BucketRoot:
    Description: Content Bucket
    Type: String
  S3BucketRootName:
    Description: Content Bucket
    Type: String
  S3BucketRootArn:
    Description: Content Bucket locator
    Type: String
  CreateApex:
    Type: String
  LogDestination:
    Description: Where CloudFront access logs (standard logging v2) are delivered - S3 or CloudWatchLogs
    Type: String
    Default: S3
    AllowedValues: ['S3', 'CloudWatchLogs']

Mappings:
  # Route 53 hosted zone ID to use in alias records that point to a CloudFront
  # distribution. This is a fixed, AWS-owned value per partition, not the ID of
  # your own hosted zone.
  # See https://docs.aws.amazon.com/Route53/latest/APIReference/API_AliasTarget.html
  CloudFrontAliasHostedZone:
    aws:
      HostedZoneId: Z2FDTNDATAQYW2
    aws-eusc:
      HostedZoneId: Z02010231DDS20FNRTLEC
Conditions:
  LogToS3: !Equals
    - !Ref LogDestination
    - S3
  LogToCloudWatch: !Equals
    - !Ref LogDestination
    - CloudWatchLogs
  CreateApexConfig: !Equals
    - !Ref CreateApex
    - 'yes'

Resources:
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref 'S3BucketRoot'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: s3:GetObject
            Principal:
              Service: 'cloudfront.amazonaws.com'
            Effect: Allow
            Resource: !Sub '${S3BucketRootArn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Sub '${SubDomain}.${DomainName}'
          - !If [CreateApexConfig, !Ref DomainName, !Ref 'AWS::NoValue']
        DefaultCacheBehavior:
          Compress: true
          # Managed policy: CachingOptimized
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6'
          TargetOriginId: !Sub 'S3-${AWS::StackName}-root'
          ViewerProtocolPolicy: 'redirect-to-https'
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCachingMinTTL: 60
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: '/404.html'
          - ErrorCachingMinTTL: 60
            ErrorCode: 403
            ResponseCode: 403
            ResponsePagePath: '/403.html'
        Enabled: true
        HttpVersion: 'http2'
        DefaultRootObject: 'index.html'
        IPV6Enabled: true
        Origins:
          - DomainName: !Ref 'S3BucketRootName'
            Id: !Sub 'S3-${AWS::StackName}-root'
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
        PriceClass: 'PriceClass_All'
        ViewerCertificate:
          AcmCertificateArn: !Ref 'CertificateArn'
          MinimumProtocolVersion: 'TLSv1.3_2025'
          SslSupportMethod: 'sni-only'
      Tags:
        - Key: Solution
          Value: ACFS3

  # CloudFront standard logging (v2) uses CloudWatch vended logs delivery.
  # Delivery resources must be created in the CloudFront control plane region (us-east-1).
  AccessLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub 'cf-${CloudFrontDistribution}-access-logs'
      LogType: ACCESS_LOGS
      ResourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
      Tags:
        - Key: Solution
          Value: ACFS3
  AccessLogGroup:
    Condition: LogToCloudWatch
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/cloudfront/${AWS::StackName}'
      RetentionInDays: 365
      Tags:
        - Key: Solution
          Value: ACFS3
  AccessLogDeliveryDestinationCloudWatch:
    Condition: LogToCloudWatch
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub 'cf-${CloudFrontDistribution}-cwl'
      DestinationResourceArn: !GetAtt AccessLogGroup.Arn
      OutputFormat: json
      Tags:
        - Key: Solution
          Value: ACFS3
  AccessLogDeliveryCloudWatch:
    Condition: LogToCloudWatch
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref AccessLogDeliverySource
      DeliveryDestinationArn: !GetAtt AccessLogDeliveryDestinationCloudWatch.Arn
      Tags:
        - Key: Solution
          Value: ACFS3
  S3BucketLogsPolicy:
    Condition: LogToS3
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref 'S3BucketLogs'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${S3BucketLogs}/cdn/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*'
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${S3BucketLogs}'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:*'
  AccessLogDeliveryDestinationS3:
    Condition: LogToS3
    Type: AWS::Logs::DeliveryDestination
    DependsOn: S3BucketLogsPolicy
    Properties:
      Name: !Sub 'cf-${CloudFrontDistribution}-s3'
      DestinationResourceArn: !Sub 'arn:${AWS::Partition}:s3:::${S3BucketLogs}/cdn'
      OutputFormat: parquet
      Tags:
        - Key: Solution
          Value: ACFS3
  AccessLogDeliveryS3:
    Condition: LogToS3
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref AccessLogDeliverySource
      DeliveryDestinationArn: !GetAtt AccessLogDeliveryDestinationS3.Arn
      S3EnableHiveCompatiblePath: false
      Tags:
        - Key: Solution
          Value: ACFS3
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        # Get a unique ID for the OAC Config name.
        # Name must be unique within account
        Name: !Sub
          - amzn-secure-static-site-${guid}
          - guid: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Route53RecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Sub '${DomainName}.'
      RecordSets:
        - Name: !Sub '${SubDomain}.${DomainName}'
          Type: 'A'
          AliasTarget:
            DNSName: !GetAtt 'CloudFrontDistribution.DomainName'
            EvaluateTargetHealth: false
            HostedZoneId: !FindInMap [CloudFrontAliasHostedZone, !Ref AWS::Partition, HostedZoneId]
        - Name: !Sub '${SubDomain}.${DomainName}'
          Type: 'AAAA'
          AliasTarget:
            DNSName: !GetAtt 'CloudFrontDistribution.DomainName'
            EvaluateTargetHealth: false
            HostedZoneId: !FindInMap [CloudFrontAliasHostedZone, !Ref AWS::Partition, HostedZoneId]

  ApexRoute53RecordSetGroup:
    Condition: CreateApexConfig
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Sub '${DomainName}.'
      RecordSets:
        - Name: !Ref 'DomainName'
          Type: 'A'
          AliasTarget:
            DNSName: !GetAtt 'CloudFrontDistribution.DomainName'
            EvaluateTargetHealth: false
            HostedZoneId: !FindInMap [CloudFrontAliasHostedZone, !Ref AWS::Partition, HostedZoneId]
        - Name: !Ref 'DomainName'
          Type: 'AAAA'
          AliasTarget:
            DNSName: !GetAtt 'CloudFrontDistribution.DomainName'
            EvaluateTargetHealth: false
            HostedZoneId: !FindInMap [CloudFrontAliasHostedZone, !Ref AWS::Partition, HostedZoneId]

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-static-site-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
            Preload: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self'; font-src https://a0.awsstatic.com; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: 'same-origin'
            Override: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

Outputs:
  CloudFrontDistribution:
    Description: CloudFront distribution
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDomainName:
    Description: Website address
    Value: !Sub '${SubDomain}.${DomainName}'
